function updateEvidence(ev){

 S.crew.forEach(function(o){

   var selfThere=ev.occ[dp.room].indexOf(o.id)>=0;
   if(ids.length===1&&!selfThere){var x=ids[0];if(ev.pub[x]==='repair'&&d.weight>=1)return;bump(o,x,34*wgt());}
   else if(ids.length>=1&&selfThere&&o.role==='crew'){ids.forEach(function(x){bump(o,x,(ids.length===1?20:6)*wgt());});}
   else if(ids.length>1)ids.forEach(function(x){bump(o,x,5*wgt());});});
  S.pairs.forEach(function(p){if(p.r!==S.round)return;
   if(p.a===o.id||p.b===o.id){var other=p.a===o.id?p.b:p.a;if(o.role==='crew'&&ev.turned.indexOf(o.id)<0)bump(o,other,-10*wgt());}
   else{bump(o,p.a,3);bump(o,p.b,3);var sa=o.sus[p.a]||0,sb=o.sus[p.b]||0;if(sa>50)bump(o,p.b,(sa-50)*0.4*wgt());if(sb>50)bump(o,p.a,(sb-50)*0.4*wgt());}});
  if(o.turnedBy!==null&&o.role==='hollow'){} // turned crew now act as Hollow; they know their maker
 });
 S.crew.forEach(function(x){if(x.clean===S.round)S.crew.forEach(function(o){if(o.sus[x.id]!==undefined)o.sus[x.id]=Math.min(o.sus[x.id],8);});});
}

  var t=null;
  if(s.role==='hollow'){if(R()<d.bluff){var hs=others.filter(function(x){return x.role!=='hollow'&&!recentlyClean(x);});
    if(hs.length){t=R()<0.5?maxBy(hs,function(x){return publicSus(x.id);}):maxBy(hs,function(x){return x.sus[s.id];});}}}
  else{var m=maxBy(others,function(x){return s.sus[x.id];});if(m&&s.sus[m.id]>42)t=m;}
  if(t){say(s,'acc',t);S.crew.forEach(function(o){if(o.id!==s.id&&o.id!==t.id)bump(o,t.id,7*trust(o,s)*wgt());});bump(t,s.id,8);

 });

function aiProposal(){
 var d=D(),best=null;
 S.crew.forEach(function(a){if(!a.free||!a.ai)return;
  var others=S.crew.filter(function(x){return x.free&&x.id!==a.id&&!(S.cooldown[x.id]>S.round);});if(!others.length)return;
  if(a.role==='crew'){var t=maxBy(others,function(x){return a.sus[x.id];});if(t&&a.sus[t.id]>=d.propT&&!recentlyClean(t)){var st=a.sus[t.id];if(!best||st>best.str)best={by:a.id,target:t.id,str:st};}}
  else if(R()<d.bluff*0.5){var hs=others.filter(function(x){return x.role!=='hollow'&&!recentlyClean(x);});var h=maxBy(hs,function(x){return publicSus(x.id);});if(h){var ps=publicSus(h.id);if(ps>=32&&(!best||ps+8>best.str))best={by:a.id,target:h.id,str:ps+8};}}
 });

}
function submitProposal(tid){

function aiVote(v,t,prop){
 var d=D();if(v.id===t.id)return false;if(v.id===prop.by)return true;
 if(v.role==='hollow'){if(t.role!=='hollow')return true;

 if(recentlyClean(t))return false;

function submitVote(pv){

 // social fallout: voting against the proposer

function endRound(){
 if(S.over)return;
 if(S.round>=MAXR){S.over={winner:'hollow',why:'The storm outlasted you. No rescue came, and the Hollow had all the time in the world.'};S.phase='over';save();return;}

}
function checkWin(){
 if(S.over)return true;
 var fr=S.crew.filter(function(c){return c.free;}),fh=fr.filter(function(c){return c.role==='hollow';}).length,fc=fr.length-fh,w=null,why='';
 if(fh===0){w='crew';why='Every Hollow is sealed in the Cold Locker. The station is safe — until the next storm.';}
 else if(fh>fc||(fh===fc&&fr.length<=4)){w='hollow';why='The Hollow now outnumber what is left of the free crew. Halvard Ridge belongs to them.';}
 else if(S.frost>=S.frostMax){w='hollow';why='The heat stayed dead too long. The station froze solid — and the Hollow simply wait for spring.';}
 else if(S.beacon>=S.target){w='crew';why='The beacon got through. A rescue flight skids onto the ice and the survivors are screened one by one.';}
 if(w){S.over={winner:w,why:why};S.phase='over';log(w==='crew'?'priv':'alert','🏁 '+why);return true;}
 return false;
}

  var guard=0;
  while(!S.over&&guard++<500){if(S.phase==='move')submitMove(null);else if(S.phase==='action')submitAction(null);else if(S.phase==='briefing')submitProposal(null);else if(S.phase==='vote')submitVote(null);}
  if(!S.over){res.errors++;continue;}
  res.games++;res[S.over.winner]++;res.rounds+=S.round;var key=S.over.why.slice(0,22);res.reasons[key]=(res.reasons[key]||0)+1;

}

 else if(S.over)renderEnd();
}
function actIcon(t){return {test:'kit',turn:'turn',repair:'repair',sabotage:'sabotage',transmit:'radio',search:'search',wait:'wait',tinker:'shop'}[t];}
function actLabel(a){var p=player(),k=sysOf(p.room),r=RM[p.room],ic=icon(actIcon(a.type),'act');
 switch(a.type){
 case 'test':return ic+'<span>Test '+esc(byId(a.target).name)+'<small>Uses your Test Kit. '+(reliableAt(p.room)?'Medical room: the result is certain.':'1 in 5 samples spoil outside a medical room.')+'</small></span>';
 case 'turn':return ic+'<span>Turn '+esc(byId(a.target).name)+'<small>They join the Hollow. If they carry a flare, you\'re exposed.</small></span>';
 case 'repair':return ic+'<span>Repair '+SYS[k].name+' (+'+((has(p,'toolkit')&&!r.alt)?2:1)+')</span>';
 case 'sabotage':var w=occ(p.room,p.id).filter(function(o){return o.role!=='hollow';});return ic+'<span>Sabotage '+SYS[k].name+'<small>'+(darkAt(p.room)?'It\'s dark. No one will see.':(w.length?'⚠ '+w.map(function(o){return o.name;}).join(', ')+' will see you!':'No witnesses here.'))+'</small></span>';
 case 'transmit':return ic+'<span>Transmit beacon (+'+(has(p,'booster')?2:1)+')'+(r.relay?'<small>Relay Mast — works while Radio is full.</small>':'')+'</span>';
 case 'tinker':return ic+'<span>Bench repair<small>+1 to '+(S.sys.power<=S.sys.radio?'Power':'Radio')+' (the lower one).</small></span>';
 case 'search':return ic+'<span>Search the '+r.name+'<small>'+(S.pools[p.room].length?'There may be gear here.':'Looks picked clean.')+(darkAt(p.room)?' Hard to see in the dark.':'')+'</small></span>';
 default:return ic+'<span>'+(r.lookout?'Keep lookout':r.thaw?'Stoke the sauna':'Keep watch')+'<small>'+(r.lookout?'Storm damage this round will be announced, not silent.':r.thaw?(S.frost>0&&S.sys.heat>=1?'Thaws 1 frost.':'Needs frost on the station and Heat 1+.'):'Do nothing; just observe.')+'</small></span>';}
}
function panelHTML(){
 var p=player();
 if(S.phase==='over')return '<div class="ph">Game over</div><button class="btn primary" data-a="showend">See result</button>';
 if(!p.free)return '<div class="ph">Locked away</div><div class="pr">You sit in the Cold Locker, listening through the door. The others carry on.</div><div class="row"><button class="btn primary" data-a="auto1">Next ▶</button><button class="btn" data-a="autoall">Skip to end ⏩</button></div>';
 var r=RM[p.room],fx='<div class="fx">'+icon(r.id,'sm')+' '+r.fx+'</div>';
 if(S.phase==='move'){var tgt=S.sel||p.room;return '<div class="ph">Step 1 · Move</div><div class="pr">You\'re in the <b>'+r.name+'</b>. Tap a highlighted room (joined by a corridor) to move, or stay.</div><button class="btn primary" data-a="move">'+icon(tgt===p.room?'stay':'move')+' '+(tgt===p.room?'Stay in the '+r.name:'Move to the '+RM[tgt].name)+'</button>'+(S.sel?'<button class="btn ghost" data-a="unsel">Cancel — stay here</button>':'');}
 if(S.phase==='action'){var w=occ(p.room,p.id);var acts=availActions(p);return '<div class="ph">Step 2 · Act</div><div class="pr"><b>'+r.name+'</b> — '+(w.length?'with '+w.map(function(c){return tok(c,20)+' '+esc(c.name);}).join(', '):'you are alone.')+(darkAt(p.room)?' <b style="color:var(--amber)">'+icon('dark','xs')+' It is dark here.</b>':'')+'</div>'+fx+acts.map(function(a,i){return '<button class="btn act'+(a.type==='turn'||a.type==='sabotage'?' danger':'')+'" data-act="'+i+'">'+actLabel(a)+'</button>';}).join('');}
 if(S.phase==='briefing'){var others=S.crew.filter(function(c){return c.free&&!c.isPlayer;});return '<div class="ph">Step 3 · Briefing</div><div class="pr">The crew gathers over the intercom. Propose locking someone in the Cold Locker? A majority vote decides.</div><div class="chips">'+others.map(function(c){var cd=S.cooldown[c.id]>S.round;return '<button class="chip" data-prop="'+c.id+'"'+(cd?' disabled style="opacity:.4"':'')+'>'+tok(c,24)+esc(c.name)+'</button>';}).join('')+'</div><button class="btn primary" data-a="noprop">No proposal — continue</button>';}
 if(S.phase==='vote'){var v=S.vote,t=byId(v.target),b=byId(v.by);return '<div class="ph">'+icon('vote','xs')+' Vote</div><div class="pr">'+tok(b,24)+' <b>'+esc(nm(b))+'</b> '+(b.isPlayer?'propose':'proposes')+' locking '+tok(t,24)+' <b>'+esc(t.name)+'</b> in the Cold Locker.</div><div class="row"><button class="btn danger c" data-vote="1">'+icon('lock')+' Lock them up</button><button class="btn c" data-vote="0">'+icon('no')+' No</button></div>';}
 return '';
}
function renderEnd(){
 var p=player(),won=S.over.winner===p.role;
 showModal('<div class="big '+(won?'win':'lose')+'">'+(won?'VICTORY':'DEFEAT')+'</div><p style="text-align:center"><b>'+(S.over.winner==='crew'?'The crew wins.':'The Hollow win.')+'</b><br>'+esc(S.over.why)+'</p><p class="hint" style="text-align:center">You finished as '+(p.role==='hollow'?'Hollow':'crew')+' · Round '+S.round+' · '+SIZES[S.size].label+' station · seed '+esc(S.layout.seed)+'</p>'+
 '<div class="lbl">Who was who</div><div class="reveal">'+S.crew.map(function(c){return '<div>'+tok(c,28)+' <b>'+esc(nm(c))+'</b> — '+(c.role==='hollow'?'<span style="color:var(--red)">Hollow</span>'+(c.turnedBy!==null?' (turned by '+esc(nm(byId(c.turnedBy)))+', R'+c.turnedR+')':' (from the start)'):'<span style="color:var(--green)">Human</span>')+(c.free?'':' · locked')+'</div>';}).join('')+'</div>'+
 '<div class="lbl">What really happened</div><div class="reveal" style="font-size:13px">'+(S.hist.map(function(x){return '<div>'+esc(x)+'</div>';}).join('')||'<div>Nothing hidden.</div>')+'</div>'+
 '<button class="btn primary c" data-a="again">Play again</button><button class="btn c" data-a="replay">Same layout again</button><button class="btn c" data-a="title">Main menu</button><button class="btn ghost c" data-a="closeend">View board</button>');
}
function stationGuide(){return '<h3>'+icon('map','sm')+' This station</h3><p class="hint">'+SIZES[S.size].label+' · '+(S.layout.random?'random layout, seed <b style="color:#fff">'+esc(S.layout.seed)+'</b>':'classic layout')+'</p><ul class="roomlist">'+ROOMS.map(function(r){return '<li>'+icon(r.id,'sm')+' <b>'+r.name+'</b> — '+r.fx+'</li>';}).join('')+'</ul><button class="btn c" data-a="closeend">Close</button>';}
function render(){if(view==='title')renderTitle();else if(view==='setup')renderSetup();else if(view==='howto')renderHowto();else renderGame();setFrost();}
var backTo='title';
function autoOne(){if(S.phase==='move')submitMove(null);else if(S.phase==='action')submitAction(null);else if(S.phase==='briefing')submitProposal(null);else if(S.phase==='vote')submitVote(null);}
function startGame(o){newGame(o);view='game';render();window.scrollTo(0,0);}
document.addEventListener('click',function(e){
 var t=e.target.closest('[data-a],[data-set],[data-room],[data-act],[data-prop],[data-vote],[data-note],[data-item]');if(!t)return;
 var a=t.getAttribute('data-a');
 if(t.hasAttribute('data-set')){var k=t.getAttribute('data-set'),v=t.getAttribute('data-val');setup[k]=k==='ai'?+v:v;try{localStorage.setItem('whiteout-setup',JSON.stringify(setup));}catch(err){}render();return;}
 if(t.hasAttribute('data-room')){if(!S)return;var r=t.getAttribute('data-room'),p=player();
  if(S.phase==='move'&&p.free){if(hasEdge(p.room,r))S.sel=(S.sel===r?null:r);else if(r===p.room)S.sel=null;else{toast(RM[r].name+' isn\'t connected to your room by a corridor.');return;}render();return;}
  toast('<b>'+RM[r].name+'</b>: '+esc(RM[r].fx));return;}
 if(t.hasAttribute('data-act')){var acts=availActions(player());var ac=acts[+t.getAttribute('data-act')];if(ac){submitAction(ac);render();}return;}
 if(t.hasAttribute('data-prop')){submitProposal(+t.getAttribute('data-prop'));render();return;}
 if(t.hasAttribute('data-vote')){submitVote(t.getAttribute('data-vote')==='1');render();return;}
 if(t.hasAttribute('data-note')){var id=+t.getAttribute('data-note'),n=S.notes[id]||'';S.notes[id]=n===''?'s':(n==='s'?'t':'');save();render();return;}
 if(t.hasAttribute('data-item')){var it=ITEMS[t.getAttribute('data-item')];toast('<b>'+it.name+'</b>: '+esc(it.desc));return;}
 switch(a){
 case 'setup':view='setup';setup.seed=randSeed();render();break;
 case 'reroll':setup.seed=randSeed();render();break;
 case 'title':hideModal();view='title';S=null;render();break;
 case 'howto':backTo=view;view='howto';render();window.scrollTo(0,0);break;
 case 'back':view=backTo==='howto'?'title':backTo;render();break;
 case 'continue':try{S=JSON.parse(localStorage.getItem('whiteout-save'));applyLayout(S.layout);view='game';render();}catch(err){toast('Save could not be loaded.');}break;
 case 'start':startGame({ai:setup.ai,diff:setup.diff,role:setup.role,size:setup.size,random:setup.random==='on',seed:setup.seed});break;
 case 'again':hideModal();startGame({ai:S.nAI,diff:S.diff,role:S.roleOpt,size:S.size,random:S.layout.random,seed:randSeed()});break;
 case 'replay':hideModal();startGame({ai:S.nAI,diff:S.diff,role:S.roleOpt,size:S.size,random:S.layout.random,seed:S.layout.seed});break;
 case 'move':submitMove(S.sel);render();break;
 case 'unsel':S.sel=null;render();break;
 case 'noprop':submitProposal(null);render();break;
 case 'ack':S.notice=null;save();hideModal();render();break;
 case 'auto1':autoOne();render();break;
 case 'autoall':var g=0;while(!S.over&&g++<400)autoOne();render();break;
 case 'showend':renderEnd();break;
 case 'closeend':hideModal();break;
 case 'guide':showModal(stationGuide());break;
 case 'menu':showModal('<h3>Menu</h3><p class="hint">Saved automatically after every step. '+SIZES[S.size].label+' station · '+(S.layout.random?'seed <b style="color:#fff">'+esc(S.layout.seed)+'</b>':'classic layout')+'</p><button class="btn" data-a="closeend">'+icon('move')+' Resume</button><button class="btn" data-a="guide">'+icon('map')+' Station guide</button><button class="btn" data-a="howto2">'+icon('help')+' How to play</button><button class="btn danger" data-a="abandon">'+icon('no')+' Abandon game</button>');break;
 case 'howto2':hideModal();backTo='game';view='howto';render();window.scrollTo(0,0);break;
 case 'abandon':hideModal();try{localStorage.removeItem('whiteout-save');}catch(err){}S=null;view='title';render();break;
 }
});
window.WP={newGame:newGame,runSim:runSim,state:function(){return S;},submitMove:submitMove,submitAction:submitAction,submitProposal:submitProposal,submitVote:submitVote,availActions:availActions,render:render,genLayout:genLayout,applyLayout:applyLayout};
render();
})();</script></body></html>
